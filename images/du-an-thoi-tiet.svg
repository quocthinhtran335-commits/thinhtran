<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mockup dashboard thời tiết cho Thành phố Hồ Chí Minh với thời tiết hiện tại, chỉ số môi trường và dự báo theo giờ, theo ngày">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4f1ef"/>
      <stop offset="1" stop-color="#d7e4e5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d16d"/>
      <stop offset="1" stop-color="#e9a44d"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="1" stop-color="#dce7e7"/>
    </linearGradient>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope=".12"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="partly-cloudy">
      <circle cx="30" cy="27" r="18" fill="url(#sun)"/>
      <g stroke="#e9ad4c" stroke-width="3" stroke-linecap="round">
        <path d="M30 1v7m0 38v7M4 27h7m38 0h7M12 9l5 5m27 27 5 5m0-37-5 5m-27 27-5 5"/>
      </g>
      <path d="M19 58h39a14 14 0 0 0 0-28 19 19 0 0 0-36-5 14 14 0 0 0-3 33z" fill="url(#cloud)" stroke="#cad8d9" stroke-width="1.5"/>
    </g>
    <g id="sunny">
      <circle cx="30" cy="30" r="17" fill="url(#sun)"/>
      <g stroke="#e9ad4c" stroke-width="3" stroke-linecap="round">
        <path d="M30 2v9m0 38v9M2 30h9m38 0h9M10 10l7 7m26 26 7 7m0-40-7 7M17 43l-7 7"/>
      </g>
    </g>
    <g id="rainy">
      <path d="M14 37h40a14 14 0 0 0 0-28 19 19 0 0 0-36-5 14 14 0 0 0-4 33z" fill="url(#cloud)" stroke="#cad8d9" stroke-width="1.5"/>
      <path d="m22 44-4 9m19-9-4 9m19-9-4 9" stroke="#60a8b5" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="960" height="680" fill="#eef3f2"/>
  <rect width="960" height="72" fill="#fffefa"/>
  <circle cx="53" cy="36" r="17" fill="#e9f1ed"/>
  <path d="M42 39h20a7 7 0 0 0 0-14 10 10 0 0 0-19-2 8 8 0 0 0-1 16z" fill="#6c8b83"/>
  <circle cx="56" cy="19" r="7" fill="#e8b251"/>
  <text x="82" y="33" fill="#253d3a" font-family="Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing=".8">MÂY TRỜI</text>
  <text x="82" y="50" fill="#74817b" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.2">THỜI TIẾT CỦA BẠN</text>
  <rect x="330" y="18" width="310" height="37" rx="18" fill="#f2f5f2" stroke="#dce4df"/>
  <circle cx="350" cy="36" r="6" fill="none" stroke="#74817b" stroke-width="1.5"/>
  <path d="m354 40 5 5" stroke="#74817b" stroke-width="1.5"/>
  <text x="370" y="40" fill="#74817b" font-family="Arial, sans-serif" font-size="11">Tìm thành phố...</text>
  <circle cx="875" cy="36" r="17" fill="#f4e4d6"/>
  <text x="875" y="40" text-anchor="middle" fill="#a45e42" font-family="Arial, sans-serif" font-size="11" font-weight="bold">QT</text>
  <text x="901" y="40" fill="#253d3a" font-family="Arial, sans-serif" font-size="11">Quốc Thịnh</text>

  <text x="40" y="101" fill="#71807a" font-family="Arial, sans-serif" font-size="10" letter-spacing="1.2">THỨ SÁU, 02 THÁNG 10</text>
  <text x="40" y="130" fill="#253d3a" font-family="Arial, sans-serif" font-size="19" font-weight="bold">Thành phố Hồ Chí Minh</text>
  <circle cx="44" cy="149" r="3" fill="#bf7c4d"/>
  <text x="54" y="153" fill="#71807a" font-family="Arial, sans-serif" font-size="10">Việt Nam  ·  Cập nhật lúc 14:30</text>

  <rect x="40" y="169" width="540" height="205" rx="8" fill="url(#sky)" filter="url(#card-shadow)"/>
  <text x="66" y="201" fill="#516b66" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.1">THỜI TIẾT HIỆN TẠI</text>
  <text x="66" y="280" fill="#253d3a" font-family="Arial, sans-serif" font-size="76" font-weight="300">32°</text>
  <text x="70" y="307" fill="#344f49" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Nắng gián đoạn</text>
  <text x="70" y="330" fill="#637770" font-family="Arial, sans-serif" font-size="11">Cảm giác như 35°  ·  Cao 34° / Thấp 26°</text>
  <g transform="translate(408 204) scale(1.45)"><use href="#partly-cloudy"/></g>
  <path d="M387 337h160" stroke="#c5d9d8" stroke-width="1"/>
  <text x="401" y="356" fill="#71807a" font-family="Arial, sans-serif" font-size="10">Trời quang dần vào buổi chiều</text>

  <rect x="600" y="169" width="320" height="205" rx="8" fill="#fffefa" filter="url(#card-shadow)"/>
  <text x="624" y="201" fill="#253d3a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Chỉ số hôm nay</text>
  <path d="M760 218v133M624 283h272" stroke="#e6ebe7" stroke-width="1"/>
  <text x="624" y="239" fill="#84918a" font-family="Arial, sans-serif" font-size="9" letter-spacing=".6">ĐỘ ẨM</text>
  <text x="624" y="267" fill="#253d3a" font-family="Arial, sans-serif" font-size="21" font-weight="bold">68%</text>
  <text x="781" y="239" fill="#84918a" font-family="Arial, sans-serif" font-size="9" letter-spacing=".6">GIÓ</text>
  <text x="781" y="267" fill="#253d3a" font-family="Arial, sans-serif" font-size="21" font-weight="bold">14 <tspan font-size="11" font-weight="normal">km/h</tspan></text>
  <text x="624" y="307" fill="#84918a" font-family="Arial, sans-serif" font-size="9" letter-spacing=".6">CHỈ SỐ UV</text>
  <text x="624" y="336" fill="#bf7c4d" font-family="Arial, sans-serif" font-size="21" font-weight="bold">7 <tspan fill="#71807a" font-size="11" font-weight="normal">Cao</tspan></text>
  <text x="781" y="307" fill="#84918a" font-family="Arial, sans-serif" font-size="9" letter-spacing=".6">MẶT TRỜI LẶN</text>
  <text x="781" y="336" fill="#253d3a" font-family="Arial, sans-serif" font-size="21" font-weight="bold">17:48</text>

  <rect x="40" y="397" width="880" height="117" rx="8" fill="#fffefa" filter="url(#card-shadow)"/>
  <text x="64" y="425" fill="#253d3a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Dự báo theo giờ</text>
  <text x="896" y="425" text-anchor="end" fill="#71807a" font-family="Arial, sans-serif" font-size="10">Hôm nay</text>
  <path d="M64 438h832" stroke="#e6ebe7"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="121" y="459" fill="#71807a" font-size="9">15:00</text><g transform="translate(101 465) scale(.38)"><use href="#partly-cloudy"/></g><text x="121" y="505" fill="#253d3a" font-size="11" font-weight="bold">32°</text>
    <text x="265" y="459" fill="#71807a" font-size="9">16:00</text><g transform="translate(245 465) scale(.38)"><use href="#sunny"/></g><text x="265" y="505" fill="#253d3a" font-size="11" font-weight="bold">31°</text>
    <text x="409" y="459" fill="#71807a" font-size="9">17:00</text><g transform="translate(389 465) scale(.38)"><use href="#sunny"/></g><text x="409" y="505" fill="#253d3a" font-size="11" font-weight="bold">30°</text>
    <text x="553" y="459" fill="#71807a" font-size="9">18:00</text><g transform="translate(533 465) scale(.38)"><use href="#partly-cloudy"/></g><text x="553" y="505" fill="#253d3a" font-size="11" font-weight="bold">29°</text>
    <text x="697" y="459" fill="#71807a" font-size="9">19:00</text><g transform="translate(677 465) scale(.38)"><use href="#partly-cloudy"/></g><text x="697" y="505" fill="#253d3a" font-size="11" font-weight="bold">28°</text>
    <text x="841" y="459" fill="#71807a" font-size="9">20:00</text><g transform="translate(821 465) scale(.38)"><use href="#rainy"/></g><text x="841" y="505" fill="#253d3a" font-size="11" font-weight="bold">27°</text>
  </g>

  <rect x="40" y="537" width="880" height="111" rx="8" fill="#fffefa" filter="url(#card-shadow)"/>
  <text x="64" y="563" fill="#253d3a" font-family="Arial, sans-serif" font-size="13" font-weight="bold">Dự báo 5 ngày</text>
  <path d="M64 575h832" stroke="#e6ebe7"/>
  <path d="M216 585v49m166-49v49m166-49v49m166-49v49" stroke="#eff1ed"/>
  <g font-family="Arial, sans-serif" font-size="9">
    <text x="68" y="601" fill="#253d3a" font-weight="bold">Thứ Bảy</text><g transform="translate(121 584) scale(.25)"><use href="#partly-cloudy"/></g><text x="155" y="601" fill="#253d3a" font-weight="bold">33°</text><text x="185" y="601" fill="#84918a">26°</text><text x="68" y="624" fill="#71807a">Mưa nhẹ 20%</text>
    <text x="234" y="601" fill="#253d3a" font-weight="bold">Chủ Nhật</text><g transform="translate(293 584) scale(.25)"><use href="#sunny"/></g><text x="321" y="601" fill="#253d3a" font-weight="bold">34°</text><text x="351" y="601" fill="#84918a">27°</text><text x="234" y="624" fill="#71807a">Nắng 10%</text>
    <text x="400" y="601" fill="#253d3a" font-weight="bold">Thứ Hai</text><g transform="translate(459 584) scale(.25)"><use href="#partly-cloudy"/></g><text x="487" y="601" fill="#253d3a" font-weight="bold">33°</text><text x="517" y="601" fill="#84918a">27°</text><text x="400" y="624" fill="#71807a">Mây nhẹ 15%</text>
    <text x="566" y="601" fill="#253d3a" font-weight="bold">Thứ Ba</text><g transform="translate(625 584) scale(.25)"><use href="#rainy"/></g><text x="653" y="601" fill="#253d3a" font-weight="bold">31°</text><text x="683" y="601" fill="#84918a">26°</text><text x="566" y="624" fill="#71807a">Mưa rào 45%</text>
    <text x="732" y="601" fill="#253d3a" font-weight="bold">Thứ Tư</text><g transform="translate(791 584) scale(.25)"><use href="#partly-cloudy"/></g><text x="819" y="601" fill="#253d3a" font-weight="bold">32°</text><text x="849" y="601" fill="#84918a">26°</text><text x="732" y="624" fill="#71807a">Mưa nhẹ 20%</text>
  </g>
  <text x="896" y="563" text-anchor="end" fill="#71807a" font-family="Arial, sans-serif" font-size="9">Cao nhất / Thấp nhất</text>
</svg>
